# Maakt elk uur een nieuw energieplan met live prijzen en weer, en zet de
# website op GitHub Pages. Eenmalig instellen: Settings → Pages → Source:
# "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"      # elk uur, 7 minuten over
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest

      - name: Growatt-koppeling installeren
        run: pip install --quiet "growattServer>=1.5,<2"

      - name: Plan maken
        env:
          # Optioneel: als Home Assistant via internet bereikbaar is (bv. Nabu
          # Casa), zet dan HA_URL en HA_TOKEN als repository secrets. De
          # planner leest dan de echte batterijlading.
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          # Inlog van de Growatt-app, als repository secrets (zie README).
          # Zonder deze secrets toont de site alleen het plan.
          GROWATT_USERNAME: ${{ secrets.GROWATT_USERNAME }}
          GROWATT_PASSWORD: ${{ secrets.GROWATT_PASSWORD }}
          GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
        run: |
          mkdir -p _site
          cp -r website/. _site/
          CONFIG=config.toml
          [ -f "$CONFIG" ] || CONFIG=config.voorbeeld.toml
          python -m energieplanner json --config "$CONFIG" --uitvoer _site/plan.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
